<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаб5</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="main">

        <!-- Авторизация -->
        <div class="container">

            <h1>Авторизация</h1>

            <input
                id="login"
                type="text"
                placeholder="Введите логин"
            >

            <input
                id="password"
                type="password"
                placeholder="Введите пароль"
            >

            <button id="loginButton">
                Войти
            </button>

            <p id="message"></p>

        </div>


        <!-- Сумма чисел -->
<div class="container">

            <h1>Сумма чисел</h1>

            <input
                id="numbers"
                type="text"
                placeholder="Например: 2, 5, 6, 7"
            >

            <button id="sumButton">
                Посчитать
            </button>

            <p id="sumResult"></p>

        </div>

    </div>

    <script src="index.js"></script>

</body>
</html>
