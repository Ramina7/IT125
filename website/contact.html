            <form id="contact-form">

                    type="text"
                    placeholder="Введите имя"

                    id="email"
                    type="email"
                    placeholder="Введите email"
                    required
                >

                <label for="message">Сообщение</label>

                <textarea
                    id="message"
                    rows="5"
                    placeholder="Напишите сообщение"
                    required
                ></textarea>

                <button class="button" type="submit">
                    Отправить сообщение
                </button>

                <p id="form-result"></p>

            </form>
